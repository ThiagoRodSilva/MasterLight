services:
  web:
    build: .
    image: plataformavendas:latest
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - media_data:/app/media
      - static_data:/app/staticfiles
    command: python manage.py runserver 0.0.0.0:8000
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: plataformavendas
      MYSQL_USER: pv_user
      MYSQL_PASSWORD: pv_pass
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  media_data:
  static_data:
  mysql_data:
