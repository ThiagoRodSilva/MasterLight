name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DJANGO_SECRET_KEY: ci-secret
      ASAAS_API_KEY: aact_ci_dummy_key
      PAYMENT_PROVIDER: asaas

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install coverage

      - name: Ruff
        run: ruff check .

      - name: Missing migrations
        run: python manage.py makemigrations --check --dry-run --noinput
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Django check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.dev

      - name: Vercel settings check
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.vercel

      - name: Tests
        run: |
          coverage run --source=apps manage.py test apps --parallel
          coverage report --fail-under=70
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
