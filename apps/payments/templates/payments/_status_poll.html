{% comment %}
Polling do status do pedido (GET payments-status). Troca a seção por um
alerta de sucesso quando o pagamento é confirmado pelo webhook.
{% endcomment %}
<div id="payment-status-panel" class="mt-4"></div>
<script>
  (function () {
    const url = '{% url "payments-status" order.pk %}';
    const panel = document.getElementById('payment-status-panel');
    let tries = 0;
    let timer;
    function check() {
      tries += 1;
      fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest' } })
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (data) {
          if (!data) {
            if (tries < 60) { timer = setTimeout(check, 5000); }
            return;
          }
          if (data.paid) {
            panel.innerHTML = '<div class="alert alert-success">Pagamento confirmado! Seu pedido foi atualizado.</div>';
            return;
          }
          if (data.canceled) {
            panel.innerHTML = '<div class="alert alert-danger">Seu pedido foi cancelado. Entre em contato com o atendimento se precisar de ajuda.</div>';
            return;
          }
          if (tries < 60) { timer = setTimeout(check, 4000); }
        })
        .catch(function () {
          if (tries < 60) { timer = setTimeout(check, 6000); }
        });
    }
    timer = setTimeout(check, 1500);
  })();
</script>
