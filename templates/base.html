<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ BRAND_NAME }}{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root {
      --bs-primary: {{ BRAND_PALETTE.primary }};
      --bs-primary-alt: {{ BRAND_PALETTE.primary_alt }};
      --bs-dark: {{ BRAND_PALETTE.dark }};
    }
    .btn-primary, .badge.bg-warning.text-dark { background-color: var(--bs-primary); border-color: var(--bs-primary); color: #111; }
    .btn-primary:hover { background-color: var(--bs-primary-alt); }
    .navbar-dark { background-color: #111; }
    .hero { background: linear-gradient(135deg, {{ BRAND_PALETTE.primary }}, {{ BRAND_PALETTE.primary_alt }}); color: #111; }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">
  {% include "partials/navbar.html" %}

  {% include "partials/messages.html" %}

  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
