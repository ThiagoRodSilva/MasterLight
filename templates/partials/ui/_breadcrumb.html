{% load static %}
<nav aria-label="breadcrumb" class="mb-4 reveal">
  <ol class="flex items-center gap-2" style="list-style: none; padding: 0; margin: 0;">
    <li><a href="{% url 'home' %}" class="text-muted">Início</a></li>
    <li class="text-muted"><i class="bi bi-chevron-right"></i></li>
    {% if parent_url and parent_name %}
    <li><a href="{{ parent_url }}" class="text-muted">{{ parent_name }}</a></li>
    <li class="text-muted"><i class="bi bi-chevron-right"></i></li>
    {% endif %}
    <li aria-current="page">{{ current }}</li>
  </ol>
</nav>
