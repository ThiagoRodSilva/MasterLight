{% load static %}
<div class="section-header {% if align_class == 'section-head--center' %}text-center{% endif %} reveal {% if delay_class %}{{ delay_class }}{% endif %}">
  <span class="eyebrow text-accent">{{ eyebrow }}</span>
  <h2 class="section-title">{{ title }}</h2>
  {% if description %}<p class="section-subtitle">{{ description }}</p>{% endif %}
</div>
