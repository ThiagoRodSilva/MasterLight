{% load static %}
<div class="{{ col_class }} reveal {% if delay_class %}{{ delay_class }}{% endif %}">
  <div class="card card-hover text-center">
    <div class="card-body">
      <div class="mb-4">
        <i class="{{ icon_class|default:'bi bi-box-seam' }} text-accent" style="font-size: 2rem;"></i>
      </div>
      <h5 class="card-title">{{ title }}</h5>
      <p class="card-text">{{ description }}</p>
      <a href="{{ url }}" class="btn btn-primary btn-sm">{{ cta_text|default:"Ver mais" }}</a>
    </div>
  </div>
</div>
