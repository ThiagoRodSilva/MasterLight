{% load static %}
<div class="{{ col_class|default:'col-12 sm:col-md-4' }} reveal {% if delay_class %}{{ delay_class }}{% endif %}">
  <div class="bg-[var(--surface-card)] shadow-md rounded-xl border-l-4 border-brand-500 h-full p-6 text-center hover:shadow-lg transition-shadow">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-dark-500 text-brand-500 mb-4">
      <i class="{{ icon_class|default:'bi bi-box-seam' }} text-2xl"></i>
    </div>
    <h5 class="text-lg font-semibold text-[var(--text-strong)] mb-2">{{ title }}</h5>
    <p class="text-[var(--color-muted)] text-sm mb-4">{{ description }}</p>
    <a href="{{ url }}" class="inline-block px-4 py-2 bg-gradient-to-r from-dark-500 to-dark-600 text-white rounded-lg text-sm font-semibold hover:from-dark-600 hover:to-dark-700 transition-all">{{ cta_text|default:"Ver mais" }}</a>
  </div>
</div>
