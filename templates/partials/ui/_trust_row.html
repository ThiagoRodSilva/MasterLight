{% load static %}
<div class="flex flex-wrap gap-3 items-center mt-4">
  {% for item in items %}
  <span class="inline-flex items-center gap-2 text-sm font-medium text-[var(--text-strong)]">
    <i class="{{ item.icon }} text-accent-500 text-base"></i> {{ item.text }}
  </span>
  {% endfor %}
</div>
