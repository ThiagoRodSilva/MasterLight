{% load static %}
<div class="{{ col_class }} reveal {% if delay_class %}{{ delay_class }}{% endif %}">
  <a href="{% url url_name product.slug %}" class="card card-hover">
    {% if product.cover %}
    <div class="card-image">
      <img src="{{ product.cover.image }}" alt="{{ product.cover.alt|default:product.name }}">
    </div>
    {% endif %}
    <div class="card-body">
      <h6 class="card-title">{{ product.name }}</h6>
      <span class="text-muted">{{ product.category|default:"Geral" }}</span>
      <p class="price">{{ price_prefix|default:"R$ " }}{{ product.price|floatformat:2 }}</p>
      <span class="btn btn-primary btn-sm btn-block">{{ cta_text|default:"Ver detalhes" }}</span>
    </div>
  </a>
</div>
