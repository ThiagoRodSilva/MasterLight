{% load static %}
<div class="flex items-center gap-2 mb-6 reveal reveal-delay-1" aria-label="Etapas do pedido" style="justify-content: center; flex-wrap: wrap;">
  <span class="flex items-center gap-2">
    <span class="badge {% if step >= 1 %}{% else %}badge-secondary{% endif %}">1</span>
    <span class="{% if step == 1 %}{% else %}text-muted{% endif %}">Carrinho</span>
  </span>
  <span style="width: 2.5rem; height: 2px; background: {% if step >= 2 %}var(--color-accent, #FFC107){% else %}var(--border-soft, #333){% endif %};"></span>
  <span class="flex items-center gap-2">
    <span class="badge {% if step >= 2 %}{% else %}badge-secondary{% endif %}">2</span>
    <span class="{% if step == 2 %}{% else %}text-muted{% endif %}">Pagamento</span>
  </span>
  <span style="width: 2.5rem; height: 2px; background: {% if step >= 3 %}var(--color-accent, #FFC107){% else %}var(--border-soft, #333){% endif %};"></span>
  <span class="flex items-center gap-2">
    <span class="badge {% if step >= 3 %}{% else %}badge-secondary{% endif %}">3</span>
    <span class="{% if step == 3 %}{% else %}text-muted{% endif %}">Confirmação</span>
  </span>
</div>
