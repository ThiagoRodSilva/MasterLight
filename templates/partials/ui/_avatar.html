{% load static %}
<div class="inline-flex items-center justify-center rounded-full {% if size_class == 'avatar-sm' %}w-8 h-8 text-xs{% elif size_class == 'avatar-lg' %}w-14 h-14 text-xl{% else %}w-10 h-10 text-sm{% endif %} bg-dark-500 text-brand-500 font-bold {% if custom_class %}{{ custom_class }}{% endif %}">
  {% if image %}
  <img src="{{ image }}" alt="{{ alt|default:'' }}" class="w-full h-full rounded-full object-cover">
  {% elif initials %}
  {{ initials }}
  {% else %}
  <i class="{{ icon|default:'bi bi-person' }}"></i>
  {% endif %}
  {% if status %}<span class="absolute bottom-0 right-0 w-3 h-3 rounded-full border-2 border-white {% if status_class == 'online' %}bg-green-500{% elif status_class == 'busy' %}bg-red-500{% else %}bg-gray-400{% endif %}"></span>{% endif %}
</div>
