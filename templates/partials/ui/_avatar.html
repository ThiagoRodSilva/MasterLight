{% load static %}
<span class="text-accent {% if custom_class %}{{ custom_class }}{% endif %}" style="display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface-dark, #1e1e1e); {% if size_class == 'avatar-sm' %}width: 2rem; height: 2rem; font-size: 0.875rem;{% elif size_class == 'avatar-lg' %}width: 3.5rem; height: 3.5rem; font-size: 1.25rem;{% elif size_class == 'avatar-xl' %}width: 4.5rem; height: 4.5rem; font-size: 1.75rem;{% else %}width: 2.5rem; height: 2.5rem; font-size: 1rem;{% endif %}">
  {% if image %}
  <img src="{{ image }}" alt="{{ alt|default:'' }}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
  {% elif initials %}
  {{ initials }}
  {% else %}
  <i class="{{ icon|default:'bi bi-person' }}"></i>
  {% endif %}
  {% if status %}<span style="position: absolute; bottom: 0; right: 0; width: 0.75rem; height: 0.75rem; border-radius: 50%; border: 2px solid #fff; {% if status_class == 'online' %}background: #22c55e;{% elif status_class == 'busy' %}background: #ef4444;{% else %}background: #9ca3af;{% endif %}"></span>{% endif %}
</span>
