{% load static %}
{% if images %}
<div class="flex gap-2 mt-4" role="tablist" aria-label="Galeria de imagens">
  {% for img in images %}
  <button type="button"
          class="{% if forloop.first %}text-accent{% endif %}"
          style="width: 4rem; height: 4rem; padding: 0.25rem; border: 2px solid {% if forloop.first %}var(--color-accent, #FFC107){% else %}var(--border-soft, #333){% endif %}; border-radius: var(--radius-md, 8px); background: transparent; cursor: pointer;"
          data-gallery-img="{{ img.image }}"
          data-gallery-alt="{{ img.alt }}"
          aria-label="Imagem {{ forloop.counter }}"
          {% if forloop.first %}aria-selected="true"{% else %}aria-selected="false"{% endif %}
          role="tab">
    <img src="{{ img.image }}" alt="{{ img.alt }}" class="w-full" style="height: 100%; object-fit: cover; border-radius: 4px;">
  </button>
  {% endfor %}
</div>
{% endif %}
