{% if is_paginated %}
<nav aria-label="Paginação" class="pagination">
  {% if page_obj.has_previous %}
  <a href="?page={{ page_obj.previous_page_number }}" class="btn btn-secondary btn-sm">Anterior</a>
  {% else %}
  <span class="btn btn-secondary btn-sm" aria-disabled="true" style="opacity: 0.5;">Anterior</span>
  {% endif %}

  <span class="text-muted">Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span>

  {% if page_obj.has_next %}
  <a href="?page={{ page_obj.next_page_number }}" class="btn btn-secondary btn-sm">Próxima</a>
  {% else %}
  <span class="btn btn-secondary btn-sm" aria-disabled="true" style="opacity: 0.5;">Próxima</span>
  {% endif %}
</nav>
{% endif %}
