<div class="toast-container" role="region" aria-label="Notificações" aria-live="polite">
  {% if messages %}
    {% for m in messages %}
      <div class="toast {% if m.level == 40 %}toast-danger{% elif m.level == 30 or m.level == 25 %}toast-warning{% elif m.level == 20 %}toast-success{% else %}toast-info{% endif %}" role="alert">
        <i class="bi {% if m.level == 40 %}bi-x-circle{% elif m.level == 30 or m.level == 25 %}bi-exclamation-triangle{% elif m.level == 20 %}bi-check2-circle{% else %}bi-info-circle{% endif %}" aria-hidden="true"></i>
        <div class="toast-message">{{ m.message }}</div>
        <button type="button" class="toast-close" aria-label="Fechar">
          <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
      </div>
    {% endfor %}
  {% endif %}
</div>
