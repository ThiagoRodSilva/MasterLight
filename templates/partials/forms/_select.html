{% load static %}
<div class="form-group {{ wrapper_class|default:'' }}">
  {% if label %}<label for="{{ id|default:name }}" class="form-label">{{ label }}{% if required %} <span class="text-accent">*</span>{% endif %}</label>{% endif %}
  <select name="{{ name }}" id="{{ id|default:name }}" class="form-control {{ select_class|default:'' }}" {% if required %}required{% endif %}>
    <option value="" {% if not value %}selected{% endif %}>{{ empty_label|default:"Selecione..." }}</option>
    {% for option_value, option_label in choices %}
      <option value="{{ option_value }}" {% if option_value == value %}selected{% endif %}>{{ option_label }}</option>
    {% endfor %}
  </select>
  {% if help_text %}<p class="form-help">{{ help_text }}</p>{% endif %}
  {% if errors %}<p class="form-error">{{ errors }}</p>{% endif %}
</div>
