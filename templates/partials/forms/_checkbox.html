{% load static %}
<div class="form-group {{ wrapper_class|default:'' }}">
  <div class="flex items-center gap-2">
    <input type="checkbox" name="{{ name }}" id="{{ id|default:name }}" class="{{ input_class|default:'' }}" value="{{ value|default:'1' }}" {% if checked %}checked{% endif %} {% if required %}required{% endif %}>
    <label for="{{ id|default:name }}" class="form-label">{{ label }}</label>
  </div>
  {% if help_text %}<p class="form-help">{{ help_text }}</p>{% endif %}
  {% if errors %}<p class="form-error">{{ errors }}</p>{% endif %}
</div>
