{% load static %}
<fieldset class="form-group {{ wrapper_class|default:'' }}">
  {% if label %}<legend class="form-label">{{ label }}{% if required %} <span class="text-accent">*</span>{% endif %}</legend>{% endif %}
  <div class="flex gap-4">
    {% for choice_value, choice_label in choices %}
    <div class="flex items-center gap-2">
      <input type="radio" name="{{ name }}" id="{{ id|default:name }}_{{ forloop.counter }}" value="{{ choice_value }}" {% if choice_value == value %}checked{% endif %} {% if required and forloop.first %}required{% endif %}>
      <label for="{{ id|default:name }}_{{ forloop.counter }}" class="form-label">{{ choice_label }}</label>
    </div>
    {% endfor %}
  </div>
  {% if help_text %}<p class="form-help">{{ help_text }}</p>{% endif %}
  {% if errors %}<p class="form-error">{{ errors }}</p>{% endif %}
</fieldset>
