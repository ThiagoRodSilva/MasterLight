{% load static %}
<div class="{{ wrapper_class|default:'mb-4' }}">
  {% if label %}<label for="{{ id|default:name }}" class="block text-sm font-medium text-gray-700 mb-1.5">{{ label }}{% if required %} <span class="text-red-500">*</span>{% endif %}</label>{% endif %}
  <input type="{{ input_type|default:'text' }}" name="{{ name }}" id="{{ id|default:name }}" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-transparent transition-all {{ input_class|default:'' }}" value="{{ value|default:'' }}" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if required %}required{% endif %} {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %} {% if pattern %}pattern="{{ pattern }}"{% endif %} {% if maxlength %}maxlength="{{ maxlength }}"{% endif %} {% if inputmode %}inputmode="{{ inputmode }}"{% endif %}>
  {% if help_text %}<p class="mt-1.5 text-sm text-gray-500">{{ help_text }}</p>{% endif %}
  {% if errors %}<p class="mt-1.5 text-sm text-red-600">{{ errors }}</p>{% endif %}
</div>
