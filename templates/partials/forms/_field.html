{% load static %}
<div class="form-group {{ wrapper_class|default:'' }}">
  {% if label %}<label for="{{ id|default:name }}" class="form-label">{{ label }}{% if required %} <span class="text-accent">*</span>{% endif %}</label>{% endif %}
  <input type="{{ input_type|default:'text' }}" name="{{ name }}" id="{{ id|default:name }}" class="form-control {{ input_class|default:'' }}" value="{{ value|default:'' }}" {% if placeholder %}placeholder="{{ placeholder }}"{% endif %} {% if required %}required{% endif %} {% if autocomplete %}autocomplete="{{ autocomplete }}"{% endif %} {% if pattern %}pattern="{{ pattern }}"{% endif %} {% if maxlength %}maxlength="{{ maxlength }}"{% endif %} {% if inputmode %}inputmode="{{ inputmode }}"{% endif %}>
  {% if help_text %}<p class="form-help">{{ help_text }}</p>{% endif %}
  {% if errors %}<p class="form-error">{{ errors }}</p>{% endif %}
</div>
