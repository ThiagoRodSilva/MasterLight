{% extends "base.html" %}
{% block content %}
<div class="card">
  <div class="card-body">
    <div class="alert alert-warning">
      <i class="bi bi-exclamation-triangle"></i>
      <strong>Excluir serviço</strong>
    </div>
    <p class="mb-4">Confirma a remoção de <strong>{{ service.name }}</strong> do catálogo?</p>
    <form method="post" data-loading>
      {% csrf_token %}
      <div class="flex gap-2">
        <a href="{% url 'services-my' %}" class="btn btn-outline">Cancelar</a>
        <button class="btn btn-danger" type="submit"><i class="bi bi-trash"></i> Confirmar exclusão</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
