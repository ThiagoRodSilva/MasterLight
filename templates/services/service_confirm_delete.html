{% extends "base.html" %}
{% block content %}
<div class="container py-5">
  <div class="form-panel--narrow">
    <div class="card card-elevated border-0 shadow-md-custom">
      <div class="card-body p-4">
        <div class="alert alert-brand mb-3">
          <i class="bi bi-exclamation-triangle me-2"></i>
          <strong>Excluir serviço</strong>
        </div>
        <p class="mb-4">Confirma a remoção de <strong>{{ service.name }}</strong> do catálogo?</p>
        <form method="post" data-loading>
          {% csrf_token %}
          <div class="d-flex gap-2 justify-content-end">
            <a href="{% url 'services-my' %}" class="btn btn-outline-brand">Cancelar</a>
            <button class="btn btn-soft-dark" type="submit"><i class="bi bi-trash me-1"></i>Confirmar exclusão</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
