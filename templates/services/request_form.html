{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5">
  <div class="form-panel--medium">
    <h1>Pedir orçamento — {{ service.name }}</h1>
    {% if service.providers.count == 0 %}
      <div class="alert alert-brand">Este serviço ainda não tem profissional disponível.</div>
    {% endif %}
    <form method="post" data-loading>
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-brand w-100" type="submit">Enviar pedido de orçamento</button>
    </form>
  </div>
</div>
{% endblock %}
