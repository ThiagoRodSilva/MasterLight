{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="section-title mb-4">Pedir orçamento — {{ service.name }}</h1>
{% if service.providers.count == 0 %}
<div class="alert alert-warning mb-4">Este serviço ainda não tem profissional disponível.</div>
{% endif %}
<form method="post" data-loading enctype="multipart/form-data">{% csrf_token %}
  <div class="card">
    <div class="card-body">
      {{ form|crispy }}
      <button type="submit" class="btn btn-primary btn-lg btn-block mt-4">Enviar pedido de orçamento</button>
    </div>
  </div>
</form>
{% endblock %}
