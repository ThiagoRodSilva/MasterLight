{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="section-title mb-4">{% if object %}Editar{% else %}Novo{% endif %} serviço</h1>
<form method="post" data-loading enctype="multipart/form-data">{% csrf_token %}
  <div class="card">
    <div class="card-body">
      {{ form|crispy }}
      <div class="flex gap-2 mt-4">
        <button type="submit" class="btn btn-primary btn-lg">Salvar</button>
        <a href="{% url 'services-my' %}" class="btn btn-outline">Cancelar</a>
      </div>
    </div>
  </div>
</form>
{% endblock %}
