{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-16">
  <h1 class="text-2xl font-bold text-[var(--text-strong)] mb-6 reveal">{% if object %}Editar{% else %}Novo{% endif %} serviço</h1>
  <form method="post" data-loading enctype="multipart/form-data">{% csrf_token %}
    <div class="bg-[var(--surface-card)] shadow-xl rounded-2xl border-l-4 border-brand-500 p-6 reveal">
      {{ form|crispy }}
      <div class="flex flex-col sm:flex-row gap-3 mt-6">
        <button type="submit" class="flex-1 px-8 py-4 bg-brand-500 text-brand-900 rounded-xl text-lg font-semibold hover:bg-brand-400 transition-all">Salvar</button>
        <a href="{% url 'services-my' %}" class="flex-1 px-6 py-3 border-2 border-brand-500 text-brand-700 rounded-xl font-semibold text-center hover:bg-brand-100 hover:text-brand-900 transition-all">Cancelar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
