{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5">
  <div class="form-panel--medium">
    <h1>{% if object %}Editar{% else %}Novo{% endif %} serviço</h1>
    <form method="post" data-loading>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-brand" type="submit">Salvar</button>
        <a href="{% url 'services-my' %}" class="btn btn-outline-brand">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
