{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5">
  <div class="form-panel--medium">
    <h1>Enviar orçamento</h1>
    <p>Serviço: <strong>{{ service_request.service.name }}</strong> — Cliente: <strong>{{ service_request.cliente.email }}</strong></p>
    <form method="post" data-loading>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-brand" type="submit">Enviar orçamento</button>
        <a href="{% url 'services-provider-requests' %}" class="btn btn-outline-brand">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
