{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="card">
  <div class="card-body">
    <h1 class="section-title">Enviar orçamento</h1>
    <p class="text-secondary">Serviço: <strong>{{ service_request.service.name }}</strong> — Cliente: <strong>{{ service_request.cliente.email }}</strong></p>
    <form method="post" data-loading>
      {% csrf_token %}
      {{ form|crispy }}
      <div class="flex gap-2 mt-4">
        <button class="btn btn-primary" type="submit">Enviar orçamento</button>
        <a href="{% url 'services-provider-requests' %}" class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
