{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5">
  <div class="form-panel--medium">
    <h1>{% if form.instance.pk %}Editar{% else %}Novo{% endif %} item de portfólio</h1>
    <form method="post" data-loading>
      {% csrf_token %}
      {{ form|crispy }}
      <button class="btn btn-brand" type="submit">Salvar</button>
    </form>
  </div>
</div>
{% endblock %}
