{% load static %}
<div class="card-grid">
  <div class="stat-card stat-card--brand reveal reveal-delay-1">
    <div class="card-body">
      <small>Saldo disponível</small>
      <h3>R$ {{ profile.balance|floatformat:2 }}</h3>
    </div>
  </div>
  <div class="stat-card stat-card--brand reveal reveal-delay-2">
    <div class="card-body">
      <small>Taxa de comissão</small>
      <h3>{% widthratio profile.commission_rate 1 100 %}%</h3>
    </div>
  </div>
  <div class="stat-card reveal reveal-delay-3">
    <div class="card-body">
      <small>Indicações totais</small>
      <h3>{{ referral_count }}</h3>
    </div>
  </div>
</div>
