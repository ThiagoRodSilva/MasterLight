{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="form-panel--medium">
  <h1 class="section-title mb-4 reveal">Editar dados</h1>
  <p class="text-muted mb-4 reveal reveal-delay-1">Seus dados de contato e endereço são usados para emitir cobranças (Pix, cartão).</p>
  <form method="post" data-loading>{% csrf_token %}
    <div class="card reveal reveal-delay-2">
      <div class="card-body">
        {{ form|crispy }}
        <div class="flex gap-3 mt-4">
          <button type="submit" class="btn btn-primary w-full"><i class="bi bi-check-lg"></i> Salvar</button>
          <a href="{% url 'accounts-me' %}" class="btn btn-outline w-full"><i class="bi bi-arrow-left"></i> Voltar</a>
        </div>
      </div>
    </div>
  </form>
</div>
{% endblock %}
