{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5 form-panel--medium">
  <h1 class="mb-2 reveal">Editar dados</h1>
  <p class="text-muted-custom mb-4 reveal reveal-delay-1">Seus dados de contato e endereço são usados para emitir cobranças (Pix, cartão).</p>
  <form method="post" data-loading>{% csrf_token %}
    <div class="card card-elevated p-4 reveal reveal-delay-2">
      {{ form|crispy }}
      <div class="d-flex gap-2 mt-4">
        <button class="btn btn-gradient flex-grow-1" type="submit"><i class="bi bi-check-lg me-1"></i> Salvar</button>
        <a href="{% url 'accounts-me' %}" class="btn btn-outline-brand flex-grow-1 text-center"><i class="bi bi-arrow-left me-1"></i> Voltar</a>
      </div>
    </div>
  </form>
</div>
{% endblock %}
