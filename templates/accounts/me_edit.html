{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="container py-5 form-panel--medium">
  <h1>Editar dados</h1>
  <p class="text-muted">Seus dados de contato e endereço são usados para emitir cobranças (Pix, cartão e boleto).</p>
  <form method="post">{% csrf_token %}{{ form|crispy }}
    <button class="btn btn-brand w-100" type="submit">Salvar</button>
  </form>
  <p class="mt-3"><a href="{% url 'accounts-me' %}">Voltar para minha conta</a></p>
</div>
{% endblock %}
