{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="auth-wrap">
<div class="card auth-panel reveal">
  <div class="card-body">
    <h1 class="card-title mb-4 reveal">Completar cadastro</h1>
    <p class="text-muted mb-4 reveal reveal-delay-1">Faltam alguns dados para usar a MasterLight (CPF, telefone e endereço são obrigatórios para pagamentos).</p>
    <form method="post" data-loading>{% csrf_token %}{{ form|crispy }}
      <button type="submit" class="btn btn-primary btn-lg btn-block reveal reveal-delay-2">Finalizar</button>
    </form>
  </div>
</div>
</div>
{% endblock %}
