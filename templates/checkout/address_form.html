{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-12 lg:py-16">
  <h1 class="text-2xl font-bold text-[var(--text-strong)] mb-6 reveal">Endereço de entrega</h1>
  <form method="post">{% csrf_token %}
    <div class="bg-[var(--surface-card)] shadow-xl rounded-2xl border-l-4 border-brand-500 p-6 reveal">
      {{ form|crispy }}
      <button type="submit" class="w-full px-8 py-4 bg-brand-500 text-brand-900 rounded-xl text-lg font-semibold hover:bg-brand-400 transition-all mt-4">Salvar</button>
    </div>
  </form>
</div>
{% endblock %}
