{% extends "base.html" %}
{% block content %}
<div class="auth-wrap">
<div class="card auth-panel text-center reveal">
  <div class="card-body">
    <h1 class="card-title mb-4">Sair</h1>
    <form method="post" data-loading>{% csrf_token %}
      <p class="text-muted mb-4">Confirma sair?</p>
      <button type="submit" class="btn btn-primary btn-lg btn-block">Sair</button>
    </form>
  </div>
</div>
</div>
{% endblock %}
