{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load socialaccount %}
{% block content %}
<div class="container py-5" style="max-width:480px">
  <h1>Entrar</h1>
  {% get_providers as providers %}
  {% if providers %}
  <div class="d-flex gap-2 mb-3">
    {% for p in providers %}
      <a href="{% provider_login_url p.id %}" class="btn btn-outline-dark">{{ p.name }}</a>
    {% endfor %}
  </div>
  {% endif %}
  <form method="post">{% csrf_token %}{{ form|crispy }}
    <button class="btn btn-dark w-100" type="submit">Entrar</button>
  </form>
  <p class="mt-3 small">Sem conta? <a href="{% url 'account_signup' %}">Cadastre-se</a></p>
</div>
{% endblock %}
