{% extends "base.html" %}
{% load crispy_forms_tags %}
{% load socialaccount %}
{% block content %}
<div class="container py-5">
  <div class="auth-panel card card-elevated border-0 shadow-brand">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-3">Entrar</h1>
      {% get_providers as providers %}
      {% if providers %}
      <div class="d-flex gap-2 mb-3">
        {% for p in providers %}
          <a href="{% provider_login_url p.id %}" class="btn btn-outline-brand">{{ p.name }}</a>
        {% endfor %}
      </div>
      {% endif %}
      <form method="post" data-loading>{% csrf_token %}{{ form|crispy }}
        <button class="btn btn-brand w-100" type="submit">Entrar</button>
      </form>
      <p class="mt-3 small">Sem conta? <a href="{% url 'account_signup' %}">Cadastre-se</a></p>
    </div>
  </div>
</div>
{% endblock %}
