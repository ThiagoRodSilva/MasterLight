{% extends "base.html" %}
{% load socialaccount static %}
{% block content %}
<div class="container py-5">
  <div class="auth-panel card card-elevated card-bordered-start-brand border-0">
    <div class="card-body p-4 p-md-5">
      <h1 class="h3 mb-3 reveal">Entrar com rede social</h1>
      {% get_providers as providers %}
      <div class="d-flex flex-column gap-2 my-3 reveal reveal-delay-1">
        {% for p in providers %}
          <a href="{% provider_login_url p.id %}?next={{ request.GET.next|default:'' }}" class="btn btn-social d-flex align-items-center justify-content-center gap-2">
            <img src="{% static 'img/social/google.svg' %}" alt="Google" width="20" height="20">
            <span>Entrar com {{ p.name }}</span>
          </a>
        {% endfor %}
      </div>
      <a href="{% url 'account_login' %}" class="btn btn-gradient w-100 mt-2 reveal reveal-delay-2">Entrar com email/senha</a>
    </div>
  </div>
</div>
{% endblock %}
