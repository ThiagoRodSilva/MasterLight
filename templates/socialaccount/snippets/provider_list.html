{% load socialaccount %}
<div class="flex gap-2">
  {% get_providers as providers %}
  {% for p in providers %}
    <a class="btn btn-outline" href="{% provider_login_url p.id %}" title="{{ p.name }}">{{ p.name }}</a>
  {% empty %}
    <p class="text-muted">Nenhum provedor social configurado. Adicione via <em>Admin → Social Applications</em> e variáveis de ambiente.</p>
  {% endfor %}
</div>
