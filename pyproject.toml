[project]
name = "masterlight"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.0.7",
    "gunicorn==23.0.0",
    "django-environ==0.11.2",
    "python-decouple==3.8",
    "PyMySQL==1.1.1",
    "cryptography==43.0.0",
    "psycopg[binary]==3.2.3",
    "Pillow==10.4.0",
    "django-allauth==64.0.0",
    "PyJWT[crypto]==2.9.0",
    "requests==2.32.3",
    "django-crispy-forms==2.3",
    "crispy-bootstrap5==2024.10",
    "django-widget-tweaks==1.5.0",
    "whitenoise==6.7.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations", "staticfiles", "static", "media", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.coverage.run]
source = ["apps"]
omit = ["apps/*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"
