[project]
name = "masterlight"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "Django==5.0.7",
    
    "django-environ==0.11.2",
    "python-decouple==3.8",
    "PyMySQL==1.1.1",
    "cryptography==43.0.0",
    "psycopg[binary]==3.2.3",
    "Pillow==10.4.0",
    "django-allauth==64.0.0",
    "PyJWT[crypto]==2.9.0",
    "requests==2.32.3",
    "django-crispy-forms==2.3",
    "crispy-bootstrap5==2024.10",
    "django-widget-tweaks==1.5.0",
    "whitenoise==6.7.0",
]

[project.optional-dependencies]
test = [
    "pytest==8.2.2",
    "pytest-django==4.10.0",
    "pytest-cov==5.0.0",
    "pytest-playwright==0.5.2",
    "playwright==1.46.0",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations", "staticfiles", "static", "media", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  | \.venv
  | venv
  | staticfiles
  | static
  | media
  | migrations
)/
'''

[tool.coverage.run]
source = ["apps"]
omit = ["apps/*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
strict_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    "migrations",
    "staticfiles",
    "static",
    "media",
    "venv",
    ".venv",
    "build.py",
]

[[tool.mypy.overrides]]
module = [
    "django.*",
    "django.conf",
    "django.db",
    "django.contrib.*",
    "allauth.*",
    "crispy_forms.*",
    "widget_tweaks.*",
    "environ.*",
    "requests.*",
    "PIL.*",
]
ignore_missing_imports = true

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"